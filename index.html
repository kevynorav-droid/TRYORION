<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORION</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- BARRA SUPERIOR ÚNICA (HEADER) -->
  <header class="top">
    <!-- 1. Menú de Ajustes Hamburguesa -->
    <button type="button" class="menu-btn" id="menuBtn" aria-label="Menú">☰</button>

    <!-- Panel flotante de Ajustes -->
    <div id="menuPanel" class="menu-panel hidden">
      <h4 class="menu-title">Ajustes de ORION</h4>
      
      <label class="setting-item">
        <span>Modo oscuro</span>
        <input type="checkbox" id="darkToggle">
      </label>

      <label class="setting-item">
        <span>Fuente</span>
        <select id="fontSelect">
          <option value="10px">Pequeña</option>
          <option value="20px" selected>Normal</option>
          <option value="30px">Grande</option>
        </select>
      </label>

      <label class="setting-item">
        <span>Idioma</span>
        <select id="langSelect">
          <option value="es" selected>Español</option>
          <option value="en">English</option>
          <option value="fr">Français</option>
        </select>
      </label>

      <button type="button" id="clearHistoryBtn" class="menu-btn-action">
        Borrar historial
      </button>

      <hr class="menu-divider">

      <div class="menu-footer">
        <span>ORION v1.0</span>
        <small>Created By ORION</small>
      </div>
    </div>

    <!-- 2. Menú de AI / Motores de Búsqueda -->
    <div class="ai-select-wrap">
      <select id="aiEngineSelect" class="ai-select">
        <option value="wikipedia">Wikipedia</option>
        <option value="orionai">ORION AI</option>
        <option value="maths">Maths</option>
      </select>
    </div>

    <!-- 3. Barra de búsqueda -->
    <div class="search-wrap">
      <form class="search-bar" id="orionForm" autocomplete="off">
        <!-- Logo pequeño interactivo -->
        <svg id="smallLogo" class="orion-logo icon-small" viewBox="0 0 100 120" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" style="cursor: pointer;">
          <circle cx="50" cy="50" r="32" />
          <line x1="18" y1="35" x2="82" y2="90" />
          <rect x="47" y="8" width="10" height="84" />
        </svg>
        
        <input type="text" id="q" placeholder="Buscar en ORION" autocomplete="off">
        
        <!-- Botón de búsqueda (Cambiado a clase 'search-submit' para evitar confusión) -->
        <button type="submit" class="search-submit" aria-label="Buscar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </form>
    </div>
  </header>

  <!-- PANTALLA PRINCIPAL (HOME) -->
  <main>
    <div class="center" id="home">
      <!-- Logo principal reutilizando la misma estructura -->
      <svg class="orion-logo logo-large" viewBox="0 0 100 120" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <circle cx="50" cy="50" r="32" />
        <line x1="18" y1="35" x2="82" y2="90" />
        <rect x="47" y="8" width="10" height="84" />
      </svg>
      <div class="brand">ORION</div>
    </div>

    <!-- CONTENEDOR DE RESULTADOS -->
    <div id="resultados" class="resultados-container hidden"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
